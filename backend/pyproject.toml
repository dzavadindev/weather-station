[project]
name = "backend"
version = "0.1.0"
description = "The backend service for storing and retreiving sensor data"
readme = "README.md"
authors = [
    { name = "dzavadindev", email = "daniil.zavadin@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "backend.main:app"
